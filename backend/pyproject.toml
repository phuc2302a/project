[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NovaH00", email = "trantay2006super@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "openai>=3.58.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-levenshtein>=0.27.5",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.9",
    "tldextract>=5.4.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
